# Configuration pour le déploiement sur Vercel (mode FastAPI).
# Les dépendances sont les mêmes que dans requirements.txt (à garder identiques).
[project]
name = "ag-news-classifier"
version = "1.0.0"
description = "API de classification d'articles de presse (AG News)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.165.0",
    "scikit-learn==1.8.0",
    "numpy==2.4.6",
    "joblib==1.6.0",
    "nltk==3.10.4",
]

# Vercel charge l'application FastAPI "app" définie dans api/index.py
[tool.vercel]
entrypoint = "api.index:app"
